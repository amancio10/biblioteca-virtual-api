spring:
  application:
    name: bibliotecavirtualapi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca-virtual}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50   # evita N+1 ao carregar coleções (autores/categorias)

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

biblioteca:
  security:
    jwt:
      # Em produção, defina JWT_SECRET (mínimo 32 caracteres). O valor padrão serve só para desenvolvimento.
      secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
      expiracao: ${JWT_EXPIRACAO:2h}
      emissor: bibliotecavirtualapi
  jobs:
    expiracao-reservas-cron: "0 */15 * * * *"   # a cada 15 minutos
